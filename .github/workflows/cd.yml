name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up code
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Build application
        run: scripts/buildprod.sh 

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Copy built image to the google cloud repository'
        run: 'gcloud builds submit --tag us-central1-docker.pkg.dev/notely-508317/notely-ar-repo/notely:latest .'
